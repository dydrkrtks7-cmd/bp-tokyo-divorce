<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="731" cy="439" r="88" fill="#a0522d" opacity="0.11"/>
    <circle cx="646" cy="-36" r="58" fill="#a0522d" opacity="0.08"/>
    <circle cx="815" cy="133" r="87" fill="#a0522d" opacity="0.15"/>
    <circle cx="337" cy="393" r="97" fill="#a0522d" opacity="0.10"/>
    <circle cx="433" cy="365" r="82" fill="#a0522d" opacity="0.17"/>
    <circle cx="-80" cy="421" r="77" fill="#a0522d" opacity="0.13"/>
    <rect x="799" y="156" width="69" height="62" rx="8" fill="#8b4513" opacity="0.10" transform="rotate(15, 88, 645)"/>
    <rect x="471" y="638" width="50" height="27" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(30, 376, -70)"/>
    <rect x="315" y="315" width="57" height="73" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(24, -33, 593)"/>
    <rect x="277" y="292" width="42" height="90" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(39, 887, 2)"/>
    <rect x="354" y="594" width="37" height="28" rx="8" fill="#8b4513" opacity="0.11" transform="rotate(9, 525, -98)"/>
    <rect x="593" y="612" width="44" height="34" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(26, 216, 154)"/>
    <rect x="736" y="618" width="43" height="45" rx="8" fill="#8b4513" opacity="0.14" transform="rotate(16, 709, -44)"/>
    <rect x="515" y="485" width="25" height="36" rx="8" fill="#8b4513" opacity="0.03" transform="rotate(10, 1024, 617)"/>
    <polygon points="1187,383 1236,481 1138,481" fill="#a0522d" opacity="0.06"/>
    <polygon points="-94,-147 -35,-29 -153,-29" fill="#a0522d" opacity="0.13"/>
    <polygon points="1200,-125 1237,-51 1163,-51" fill="#a0522d" opacity="0.11"/>
    <polygon points="1280,647 1351,789 1209,789" fill="#a0522d" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,576 C360,603 840,549 1200,576 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마곡 유흥 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마곡 — 유흥
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마곡 마곡 유흥 추천정보 — 유흥
  </text>
</svg>